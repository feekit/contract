[package]
name = "feekit"
version = "0.1.0"
description = "On-chain kits for pump.fun creator fees"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "feekit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
